  short_description: "Check how AI accesses, understands and surfaces a business"
  default_prompt: "Check my website's AI discoverability, then offer the sourced ten-question sample."

dependencies:
  tools:
    - type: "mcp"
      value: "aido-discoverability-check"
      description: "Read-only public website evidence and AIDO research analysis"
